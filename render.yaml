services:
  - type: web
    name: syncspace-watch-party
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: syncspace-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/syncspace.db
      - key: CLIENT_ORIGIN
        sync: false
